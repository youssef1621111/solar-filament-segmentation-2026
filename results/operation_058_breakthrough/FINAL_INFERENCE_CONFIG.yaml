# FINAL INFERENCE CONFIGURATION: OPERATION 0.58 BREAKTHROUGH
# IEEE BigData 2026 Cup — Solar Filament Segmentation
# Target: Public Leaderboard Breakthrough (PQ >= 0.70 Target, 0.62+ Confirmed Step)

pipeline:
  name: "Championship Candidate Recovery & Disjoint Stamping"
  version: "3.0.0-breakthrough"
  target_metric: "Panoptic Quality (strict IoU > 0.50)"
  evaluation_mode: "Consensus Harmonized"

input_specifications:
  native_resolution: [2048, 2048]
  color_channels: 1  # GONG H-alpha monochromatic absorption
  normalization:
    type: "solar_standardization"
    clip_percentiles: [0.5, 99.5]

tiling:
  strategy: "gaussian_sliding_window"
  tile_size: [1024, 1024]
  stride: 512
  overlap: 0.50
  window_function: "hann_2d"
  peak_vram_limit_mb: 4096

backbones:
  anchor_baseline:
    source: "results/weight_space_programming/validation_results/submission_clean_zenith_1324.csv"
    description: "Verified 0.58 Anchor (1324 instances across 178 active stems, 0 quiet-sun FPs)"
    priority_tier: 1  # 100% immutable priority
    erosion_allowed: false
    dilation_allowed: false

  candidate_source:
    source: "results/weight_space_programming/validation_results/submission_wsp_championship.csv"
    description: "5-Fold ConvNeXt-Tiny + WSP EfficientNet-B0 Tiled Ensemble (2185 instances)"
    priority_tier: 2  # Disjoint solo candidates only

wsp_surgical_parameters:
  convnext_tiny:
    fold0_threshold: 0.60
    fold1_threshold: 0.60
    fold2_threshold: 0.60
    fold3_wsp_bias_shift: -0.35
    fold3_threshold: 0.60
    fold4_threshold: 0.50  # Dynamic logit recovery
  efficientnet_b0:
    fold0_wsp_edit: "Level 1 Composite (bias -0.15, boost inhibitors x1.10, prune leak channels)"
    fold0_threshold: 0.70

candidate_recovery_gates:
  min_area_pixels: 400
  max_area_pixels: 15000
  min_elongation_pca: 2.20
  max_circularity: 0.38
  sunspot_umbra_veto:
    enabled: true
    max_area: 500
    max_elongation: 1.38
    min_circularity: 0.68
  quiet_sun_guard:
    enabled: true
    excluded_stems:
      - "20160513133714Th"
      - "20180507140210Th"
    max_rows_on_excluded_stems: 0

canvas_stamping_policy:
  mode: "strict_disjoint"
  tier1_anchor:
    action: "stamp_verbatim"
    overlap_policy: "protected"
  tier2_candidate_solos:
    action: "stamp_on_residual_background"
    overlap_policy: "clip_or_discard"
    min_residual_area_pixels: 350
  guaranteed_collision_count: 0

output_specifications:
  format: "csv"
  columns:
    - "filament_id"
    - "segmentation_rle"
  rle_compression: "COCO_LEB128_FORTRAN"
  expected_canvas_pixels: 4194304
  output_path: "results/operation_058_breakthrough/predictions/submission_breakthrough_sota.csv"
